name: Backlog Sync

on:
  schedule:
    - cron: '0 * * * *'  # Run hourly
  workflow_dispatch:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, assigned, unassigned]
  pull_request:
    types: [opened, closed, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write

jobs:
  sync-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find previous status cache artifact
        id: find-cache
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            try {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'status-cache',
                per_page: 1
              });
              if (data.artifacts.length > 0) {
                const runId = String(data.artifacts[0].workflow_run.id);
                core.info(`Found status-cache artifact from run ${runId}`);
                return runId;
              }
            } catch (e) {
              core.warning(`Could not list artifacts: ${e.message}`);
            }
            return '';

      - name: Download previous status cache
        if: steps.find-cache.outputs.result != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          name: status-cache
          run-id: ${{ steps.find-cache.outputs.result }}
          path: /tmp/status-cache
        continue-on-error: true

      - name: Sync backlog items
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const fs = require('fs');
            const helpers = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/projectv2-helpers.js'));

            try {
              const config = helpers.loadConfig(process.env.GITHUB_WORKSPACE);
              if (config.automations.backlogSync === false) {
                core.info('Backlog sync automation is disabled in config.');
                return;
              }

              // Load previous status cache (best-effort; tolerate missing on first run)
              let previousCache = new Map();
              try {
                const cacheContent = fs.readFileSync('/tmp/status-cache/status-cache.json', 'utf8');
                previousCache = helpers.loadStatusCache(cacheContent);
                core.info(`Loaded ${previousCache.size} entries from previous status cache.`);
              } catch (e) {
                core.info('No previous status cache found (first run or download failed).');
              }

              const staleLabelName = (config.labels.stale || 'Stale').toLowerCase();
              const { viewerLogin, repositories } = await helpers.queryRepositoriesForUser(github, core);
              const projectItems = await helpers.queryProject(github, config, core);

              const projectItemsByContentId = new Map(
                projectItems.filter((item) => item.contentId).map((item) => [item.contentId, item])
              );

              async function fetchIssuesByFilter(owner, repo, filterBy) {
                const results = [];
                let after = null;
                let hasNextPage = true;

                while (hasNextPage) {
                  const response = await github.graphql(
                    `
                      query($owner: String!, $repo: String!, $after: String, $filterBy: IssueFilters) {
                        repository(owner: $owner, name: $repo) {
                          issues(first: 100, after: $after, states: OPEN, filterBy: $filterBy) {
                            nodes {
                              id
                              number
                              state
                              author {
                                login
                              }
                              assignees(first: 20) {
                                nodes {
                                  login
                                }
                              }
                              labels(first: 20) {
                                nodes {
                                  name
                                }
                              }
                            }
                            pageInfo {
                              hasNextPage
                              endCursor
                            }
                          }
                        }
                      }
                    `,
                    {
                      owner,
                      repo,
                      after,
                      filterBy
                    }
                  );

                  const issueConnection = response?.repository?.issues;
                  if (!issueConnection) {
                    throw new Error(`Malformed issue query response for ${owner}/${repo}`);
                  }

                  results.push(...(issueConnection.nodes || []));
                  hasNextPage = Boolean(issueConnection.pageInfo?.hasNextPage);
                  after = issueConnection.pageInfo?.endCursor || null;
                }

                return results;
              }

              const eligibleIssuesById = new Map();

              for (const repository of repositories) {
                const openLinkedIssueIds = await helpers.queryOpenLinkedIssueIds(
                  github,
                  repository.owner,
                  repository.name,
                  core
                );
                const createdByViewer = await fetchIssuesByFilter(repository.owner, repository.name, { createdBy: viewerLogin });
                const assignedToViewer = await fetchIssuesByFilter(repository.owner, repository.name, { assignee: viewerLogin });

                for (const issue of [...createdByViewer, ...assignedToViewer]) {
                  const labels = (issue.labels?.nodes || []).map((label) => label.name.toLowerCase());
                  const hasStaleLabel = labels.includes(staleLabelName);
                  const hasLinkedOpenPullRequest = openLinkedIssueIds.has(issue.id);

                  if (!hasStaleLabel && !hasLinkedOpenPullRequest) {
                    eligibleIssuesById.set(issue.id, issue);
                  }
                }
              }

              core.info(`Found ${eligibleIssuesById.size} eligible issues for Backlog.`);

              // Build current status map for the cache (before any mutations)
              const currentStatusMap = new Map();
              for (const item of projectItems) {
                if (item.contentId && item.statusOptionId !== null) {
                  currentStatusMap.set(item.contentId, item.statusOptionId);
                }
              }

              // Only seed brand-new items (not yet on the board) into Backlog.
              // Items already on the board are left exactly where they are.
              for (const issue of eligibleIssuesById.values()) {
                const projectItem = projectItemsByContentId.get(issue.id);
                if (!projectItem) {
                  const newItemId = await helpers.addItemToProject(github, config, issue.id, core);
                  await helpers.moveItemInProject(github, config, newItemId, config.columns.backlog, core);
                  currentStatusMap.set(issue.id, config.columns.backlog);
                  core.info(`Added issue #${issue.number} to project and placed in Backlog.`);
                } else {
                  core.info(`Issue #${issue.number} already on board (${projectItem.statusName || 'no status'}) — not moving.`);
                }
              }

              // Write updated status cache for subsequent runs
              const cacheDir = '/tmp/status-cache-new';
              fs.mkdirSync(cacheDir, { recursive: true });
              fs.writeFileSync(
                path.join(cacheDir, 'status-cache.json'),
                helpers.serializeStatusCache(currentStatusMap)
              );
              core.info(`Status cache written with ${currentStatusMap.size} entries.`);
            } catch (error) {
              core.setFailed(`Backlog sync failed: ${error.message}`);
            }

      - name: Upload status cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-cache
          path: /tmp/status-cache-new/status-cache.json
          if-no-files-found: ignore
          overwrite: true
