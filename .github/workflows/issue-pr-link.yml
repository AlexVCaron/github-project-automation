name: Issue PR Link Detection

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  detect-linked-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move linked issues to progress
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const helpers = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/projectv2-helpers.js'));

            try {
              const config = helpers.loadConfig(process.env.GITHUB_WORKSPACE);
              if (config.automations.issuePrLinking === false) {
                core.info('Issue-PR linking automation is disabled in config.');
                return;
              }

              const body = context.payload.pull_request.body || '';
              const linkedIssues = helpers.findLinkedIssues(body);

              if (linkedIssues.length === 0) {
                core.info('No linked issues found in PR body.');
                return;
              }

              core.info(`Found linked issues: ${linkedIssues.join(', ')}`);

              const projectItems = await helpers.queryProject(github, config, core);
              const projectItemsByContentId = new Map(
                projectItems.filter((item) => item.contentId).map((item) => [item.contentId, item])
              );

              for (const issueNumber of linkedIssues) {
                const issueResponse = await github.graphql(
                  `
                    query($owner: String!, $repo: String!, $issueNumber: Int!) {
                      repository(owner: $owner, name: $repo) {
                        issue(number: $issueNumber) {
                          id
                          state
                        }
                      }
                    }
                  `,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issueNumber
                  }
                );

                const issueNode = issueResponse?.repository?.issue;
                if (!issueNode) {
                  core.warning(`Issue #${issueNumber} was not found in ${context.repo.owner}/${context.repo.repo}.`);
                  continue;
                }

                let projectItem = projectItemsByContentId.get(issueNode.id);
                if (!projectItem) {
                  const newItemId = await helpers.addItemToProject(github, config, issueNode.id, core);
                  projectItem = { itemId: newItemId, statusOptionId: null };
                  projectItemsByContentId.set(issueNode.id, projectItem);
                  core.info(`Added linked issue #${issueNumber} to project.`);
                }

                if (helpers.shouldMovePromoteOnly(config, projectItem.statusOptionId, config.columns.progress)) {
                  await helpers.moveItemInProject(github, config, projectItem.itemId, config.columns.progress, core);
                  core.info(`Moved issue #${issueNumber} to Progress.`);
                } else {
                  core.info(`Issue #${issueNumber} is already at or above Progress rank — not moving.`);
                }
              }
            } catch (error) {
              core.setFailed(`Failed to process linked issues: ${error.message}`);
            }
