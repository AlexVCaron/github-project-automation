name: Stale Label Handler

on:
  issues:
    types: [labeled, unlabeled]
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  handle-stale-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move stale items in project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const helpers = require(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/projectv2-helpers.js'));

            try {
              const config = helpers.loadConfig(process.env.GITHUB_WORKSPACE);
              if (config.automations.staleLabelHandler === false) {
                core.info('Stale label automation is disabled in config.');
                return;
              }

              const staleLabelName = config.labels.stale || 'Stale';
              const labelName = context.payload.label?.name;

              if (labelName !== staleLabelName) {
                core.info(`Ignoring non-stale label event: ${labelName}`);
                return;
              }

              const action = context.payload.action;
              const isIssueEvent = Boolean(context.payload.issue);
              const itemPayload = context.payload.issue || context.payload.pull_request;
              const contentId = itemPayload.node_id;

              const projectItems = await helpers.queryProject(github, config, core);
              let projectItem = projectItems.find((item) => item.contentId === contentId);

              if (!projectItem) {
                const addedItemId = await helpers.addItemToProject(github, config, contentId, core);
                projectItem = { itemId: addedItemId, statusOptionId: null };
                core.info(`Added item #${itemPayload.number} to project.`);
              }

              let targetColumnId = null;

              if (action === 'labeled') {
                targetColumnId = config.columns.waiting;
              } else if (action === 'unlabeled') {
                if (isIssueEvent) {
                  const issueResponse = await github.graphql(
                    `
                      query($owner: String!, $repo: String!, $issueNumber: Int!) {
                        repository(owner: $owner, name: $repo) {
                          issue(number: $issueNumber) {
                            linkedPullRequests(first: 20) {
                              nodes {
                                state
                              }
                            }
                          }
                        }
                      }
                    `,
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issueNumber: itemPayload.number
                    }
                  );

                  const linkedPullRequests = issueResponse?.repository?.issue?.linkedPullRequests?.nodes || [];
                  const hasLinkedOpenPullRequest = linkedPullRequests.some((pr) => pr.state === 'OPEN');
                  targetColumnId = hasLinkedOpenPullRequest ? config.columns.progress : config.columns.todo;
                } else {
                  targetColumnId = itemPayload.state === 'closed' ? config.columns.done : config.columns.progress;
                }
              } else {
                core.info(`Ignoring unsupported stale action: ${action}`);
                return;
              }

              if (projectItem.statusOptionId !== targetColumnId) {
                await helpers.moveItemInProject(github, config, projectItem.itemId, targetColumnId, core);
                core.info(`Moved item #${itemPayload.number} after stale label ${action}.`);
              } else {
                core.info('Item already in expected column.');
              }
            } catch (error) {
              core.setFailed(`Failed to process stale label event: ${error.message}`);
            }
